name: CI

on:
  push:
    branches: [main, "feat/**", "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ahdah?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ENABLE_DEMO_OTP: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ahdah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
