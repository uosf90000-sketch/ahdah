<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f33" />
  <title>عهدتك</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#0b1f33;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;padding:24px}.card{max-width:420px;background:#fff;border:1px solid #dde4ed;border-radius:28px;padding:32px;text-align:center;box-shadow:0 14px 40px rgba(11,31,51,.08)}.mark{width:74px;height:74px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:#0b1f33;color:#fff;font-size:34px}.muted{color:#52647a;line-height:1.9}button{border:0;border-radius:16px;background:#146ef5;color:#fff;padding:13px 20px;font:inherit;font-weight:700}</style>
</head>
<body>
  <main class="card">
    <div class="mark">▱</div>
    <h1>عهدتك</h1>
    <p class="muted">تعذر الاتصال بالخدمة. تحقق من الإنترنت ثم حاول مرة أخرى.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
